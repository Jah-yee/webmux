name: Set up WebMux toolchain
description: >
  Restores dependency caches read-only and installs the requested toolchains.
  Caches are saved only from main (see save-cache), so pull requests never
  add per-ref copies to the repository's cache quota.

inputs:
  go:
    description: Install Go from go.mod and restore its module/build cache.
    default: "false"
  browsers:
    description: Install Playwright Chromium and its system dependencies.
    default: "false"

outputs:
  pnpm-store:
    description: pnpm content-addressable store path.
    value: ${{ steps.pnpm-store.outputs.path }}
  pnpm-key:
    description: Exact pnpm cache key for this lockfile.
    value: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
  pnpm-hit:
    description: Whether the exact pnpm cache key was restored.
    value: ${{ steps.pnpm-cache.outputs.cache-hit }}
  go-paths:
    description: Go module and build cache paths, newline separated.
    value: ${{ steps.go-paths.outputs.paths }}
  go-key:
    description: Exact Go cache key for this go.sum.
    value: ${{ steps.go-cache.outputs.cache-primary-key }}
  go-hit:
    description: Whether the exact Go cache key was restored.
    value: ${{ steps.go-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 12.11.2
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - id: pnpm-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
    - shell: bash
      run: pnpm --dir web install --frozen-lockfile

    - if: inputs.go == 'true'
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: false
    - if: inputs.go == 'true'
      id: go-paths
      shell: bash
      run: |
        {
          echo "paths<<EOF"
          go env GOMODCACHE
          go env GOCACHE
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
    - if: inputs.go == 'true'
      id: go-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.go-paths.outputs.paths }}
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}
        restore-keys: go-${{ runner.os }}-${{ runner.arch }}-

    # The shell runs most suites; the push E2E needs new headless Chromium,
    # whose notification permission and service worker notifications work.
    - if: inputs.browsers == 'true'
      shell: bash
      run: pnpm --dir web exec playwright install --with-deps chromium
