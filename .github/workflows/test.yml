name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request supersedes its running checks; main
# runs always finish so every merged commit keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Platform-independent suites run on Ubuntu only. macOS keeps one job per run
# (macOS concurrency is capped per account) for the darwin-specific Go process
# code and the real-PTY E2E suite.
jobs:
  lint:
    name: Format, check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
        with:
          go: "true"
      - name: Check formatting
        run: make format-check
      - name: Lint frontend
        run: pnpm --dir web lint
      - name: Check and build frontend
        run: pnpm --dir web build
      - name: Build shared Ubuntu E2E runtime
        run: |
          mkdir -p "$RUNNER_TEMP/webmux-e2e"
          go build -trimpath -o "$RUNNER_TEMP/webmux-e2e/webmux" ./cmd/webmux
          tar -czf "$RUNNER_TEMP/webmux-e2e.tar.gz" -C "$RUNNER_TEMP/webmux-e2e" webmux
      - name: Share Ubuntu E2E runtime
        uses: actions/upload-artifact@v4
        with:
          name: e2e-runtime-ubuntu
          path: ${{ runner.temp }}/webmux-e2e.tar.gz
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Save pnpm cache
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.pnpm-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.setup.outputs.pnpm-store }}
          key: ${{ steps.setup.outputs.pnpm-key }}

  go:
    name: Go race (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
        with:
          go: "true"
      - name: Build embedded frontend
        run: pnpm --dir web exec vite build
      - name: Run Go race tests
        run: go test -race -parallel=4 ./...
      # No Windows runner: hosted runners lack a usable WSL 2, so the Windows
      # clients are cross-compiled and vetted here and verified by hand in WSL.
      - name: Cross-compile the Windows tray and console client
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -o /dev/null ./cmd/webmux-tray
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -o /dev/null ./cmd/webmux-windows
          done
      - name: Vet the Windows clients
        run: GOOS=windows go vet ./cmd/webmux-tray ./cmd/webmux-windows ./internal/tray/... ./internal/wslclient/... ./internal/attach/... ./internal/sessioncmd/...
      - name: Warm the E2E backend build cache
        run: go build -o /dev/null ./cmd/webmux
      - name: Save Go cache
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.go-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.setup.outputs.go-paths }}
          key: ${{ steps.setup.outputs.go-key }}

  vitest:
    name: Vitest unit and browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: "true"
      - name: Run Vitest unit suite
        run: pnpm --dir web test:unit
      - name: Run Vitest browser suite
        run: pnpm --dir web test:browser
      - name: Preserve Vitest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: web/.vitest/attachments/
          if-no-files-found: ignore
          retention-days: 14

  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: "true"
      - name: Build and test Storybook
        run: pnpm --dir web test:storybook
      - name: Preserve Storybook diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-results
          path: |
            web/playwright-report/storybook/
            web/test-results/storybook/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: E2E (Ubuntu ${{ matrix.shard }}/6)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: "true"
      - name: Download shared E2E runtime
        uses: actions/download-artifact@v4
        with:
          name: e2e-runtime-ubuntu
          path: ${{ runner.temp }}
      - name: Extract shared E2E runtime
        run: tar -xzf "$RUNNER_TEMP/webmux-e2e.tar.gz" -C "$RUNNER_TEMP"
      - name: Run Playwright E2E shard
        env:
          WEBMUX_E2E_BINARY: ${{ runner.temp }}/webmux
        run: pnpm --dir web exec playwright test --config playwright.config.ts --shard=${{ matrix.shard }}/6
      - name: Preserve E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-ubuntu-${{ matrix.shard }}
          path: |
            web/playwright-report/e2e/
            web/test-results/e2e/
          if-no-files-found: ignore
          retention-days: 14

  macos:
    name: Go race and E2E (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
        with:
          go: "true"
          browsers: "true"
      - name: Build embedded frontend
        run: pnpm --dir web exec vite build
      - name: Run Go race and Playwright E2E
        env:
          WEBMUX_E2E_DIST: ${{ github.workspace }}/web/dist
        run: bash .github/scripts/test-macos.sh
      - name: Preserve E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-macos
          path: |
            web/playwright-report/e2e/
            web/test-results/e2e/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save pnpm cache
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.pnpm-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.setup.outputs.pnpm-store }}
          key: ${{ steps.setup.outputs.pnpm-key }}
      - name: Save Go cache
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.go-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.setup.outputs.go-paths }}
          key: ${{ steps.setup.outputs.go-key }}

  performance:
    name: CLS and 4x CPU (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go: "true"
          browsers: "true"
      - name: Verify production layout stability and throttled interactions
        run: pnpm --dir web test:performance
      - name: Preserve performance measurements and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: |
            web/playwright-report/performance/
            web/test-results/performance/
          if-no-files-found: ignore
          retention-days: 14

  # Single stable check name for branch protection, independent of job layout.
  test-result:
    name: Test result
    if: always()
    needs: [lint, go, vitest, storybook, e2e, macos, performance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
