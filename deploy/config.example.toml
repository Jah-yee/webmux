# Default listens on all interfaces; restrict access with a firewall/VPN.
# Use "127.0.0.1:7681" for loopback only.
listen = "0.0.0.0:7681"
# Empty generates a new random token on every start unless listen is loopback.
token = ""
scrollback_bytes = 2097152
default_cwd = "~"
# Optional repository registry only; sessions and terminal buffers are not saved.
# Default: $XDG_STATE_HOME/webmux, or ~/.local/state/webmux.
# Use a separate state_dir for each server instance. Git is optional.
# state_dir = "~/.local/state/webmux"
idle_after_seconds = 30
prompt_patterns = ['[$#%>❯›?:]\s*$', '(?i)\(y/n\)|\[y/n\]|yes.*no|press enter']
allowed_origins = []
# Advertise WARP_CLI_AGENT_PROTOCOL_VERSION=1 so agents such as omp report
# questions, approvals and completion as structured terminal events.
agent_protocol = true
# Treat a terminal bell (not within 1 s of your own input) as needing attention.
bell_attention = true

# Cloudflare Tunnel: `webmux --tunnel` or enabled = true. Without a token a
# random 256-bit one is generated per start; tunnel mode prints it in links.
# A configured webmux token must be at least 43 characters in tunnel mode.
# The root `token` above is the WebMux login token; `[tunnel].token` below is
# the Cloudflare tunnel credential from the dashboard. They are different.
# [tunnel]
# enabled = false
# Empty = Quick Tunnel (random *.trycloudflare.com); set for a Named Tunnel.
# Named Tunnel also requires a hostname (the public hostname in Cloudflare).
# token = ""
# hostname = ""        # Named public hostname; bare ASCII/punycode, no wildcard
# cloudflared = ""     # explicit binary; default PATH, then a verified download
# Mirror prefixes tried after GitHub; [] = GitHub only.
# download_mirrors = ["https://ghfast.top", "https://gh-proxy.com"]
# Guide: docs/cloudflare-tunnel.md

# Web Push attention alerts (question, approval, turn done, error, notify).
# Phones subscribe only from the Named Tunnel origin https://<tunnel.hostname>
# (a Quick Tunnel address changes every start); loopback works on desktops.
# Keys and subscriptions live in <state_dir>/push.json.
# [push]
# enabled = true
# subject = "https://github.com/mzdluo123/webmux"  # https:// URL or mailto:
# ttl_seconds = 86400                                 # 0..2419200
# kinds = ["question", "permission", "error", "done", "notify"]  # also "bell"
# include_title = true                                # false: title "WebMux"

# Save custom launch configurations in Settings → 启动配置.
# Their complete argv and optional environment are stored separately in
# <state_dir>/launch-configs.json; a new installation has no launch commands.
# Commands run directly, without an implicit shell. To load ~/.bashrc for
# Open Code, save argv ["bash", "-ic", "exec opencode \"$@\"", "opencode"].
