<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0d1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the saved theme before the application module and its CSS load.
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem("webmux.theme");
        } catch {
          // Storage can be unavailable in private browsing; system theme remains usable.
        }
        const dark =
          saved === "dark" ||
          (saved !== "light" &&
            !matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
    <!-- font-preload:start -->
    <link
      rel="preload"
      href="/fonts/inter-latin-3100e775.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/maple-400-latin-0909c56b.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/maple-700-latin-9c0a39e5.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <!-- font-preload:end -->
    <title>WebMux</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
