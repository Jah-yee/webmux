version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    # Freeze only legacy test error handling; production has no baseline.
    rules:
      - path: _test\.go$
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
